name: Build iOS Installer (.ipa)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Precache iOS Artifacts
        run: flutter precache --ios

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Install CocoaPods dependencies
        run: |
          # Generar configuraciones iniciales de Flutter para iOS
          flutter build ios --config-only --no-codesign
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS App (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Package .ipa File
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -9 R_Music_v2.0.0.ipa Payload

      - name: Upload iOS .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: R_Music_v2.0.0_iOS_Installer
          path: R_Music_v2.0.0.ipa
          if-no-files-found: error
          retention-days: 30
