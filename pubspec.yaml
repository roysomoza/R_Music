name: pure_audio
description: "A new Flutter project."
publish_to: 'none'

version: 2.0.0+2

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^8.1.0
  just_audio: ^0.10.5
  file_picker: ^11.0.2
  just_audio_windows: ^0.2.3
  path_provider: ^2.1.6
  just_audio_background: ^0.0.1-beta.17
  path: ^1.9.0
  audio_service: ^0.18.12
  permission_handler: ^11.4.0
  audiotags: ^1.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - r_music_icono_full_new.png
    - r_music_icono_60_new.png
    - r_music_icono_full.png
    - r_music_icono_60.png
    - r_music_app_icon_v2.png
    - r_music_waveform_final.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "r_music_icono_full_new.png"
  adaptive_icon_background: "r_music_icono_full_new.png"
  adaptive_icon_foreground: "r_music_icono_full_new.png"
  windows:
    generate: true
    image_path: "r_music_icono_full_new.png"
